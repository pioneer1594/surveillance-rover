<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart GuardX – User Profile</title>
    <meta name="description" content="View and manage your Smart GuardX user profile.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        (function() {
            var saved = localStorage.getItem('sgx_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>
</head>
<body>
    <div class="dashboard-layout">
        <!-- ===== TOP NAV ===== -->
        <nav class="topnav">
            <div class="topnav-brand">
                <img src="images/logo26-withoutbg.png" alt="SmartGuardX Logo" class="brand-logo-sm">
                <span>SmartGuardX</span>
            </div>

            <!-- Mobile Action Cluster (Disconnect Icon & Hamburger) -->
            <div class="topnav-mobile-actions">
                <button class="btn btn-danger mobile-logout-btn" onclick="logout()" title="Disconnect">
                    <span>⏻</span>
                </button>
                <button class="nav-toggle-btn" id="navToggle" onclick="toggleMobileNav()" aria-label="Toggle navigation">
                    ☰
                </button>
            </div>

            <!-- Nav Links (Desktop & Mobile Dropdown) -->
            <div class="topnav-links" id="topnavLinks">
                <button class="btn btn-outline btn-sm theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Change Theme (Dark / Light / Black & White)">
                    <span id="themeToggleIcon">🌙</span> <span id="themeToggleText">Dark</span>
                </button>
                <a href="index.html" class="nav-link">⚙️ Dashboard</a>
                <a href="user_profile.html" class="nav-link active">👤 Profile</a>
                <button class="btn btn-danger btn-sm desktop-logout-btn" id="logoutBtn" onclick="logout()" title="Disconnect">
                    <span class="logout-icon">⏻</span>
                    <span class="logout-text">DISCONNECT</span>
                </button>
            </div>
        </nav>

        <!-- ===== PROFILE CONTENT ===== -->
        <main class="profile-main">
            <div class="profile-card">
                <div class="profile-avatar">
                    <span class="avatar-icon">👤</span>
                    <div class="avatar-ring"></div>
                </div>

                <h1 id="profileUsername">Loading...</h1>
                <p class="profile-role">ROVER OPERATOR</p>

                <div class="profile-badge">
                    <span class="auth-badge-dot"></span>
                    AUTHORIZED USER
                </div>

                <div class="profile-stats">
                    <div class="stat-item">
                        <span class="stat-value" id="statSessions">—</span>
                        <span class="stat-label">Sessions</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="statVideos">—</span>
                        <span class="stat-label">Recordings</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value">3FA</span>
                        <span class="stat-label">Auth Level</span>
                    </div>
                </div>

                <div class="profile-info-grid">
                    <div class="info-row">
                        <span class="info-label">🔑 Username</span>
                        <span class="info-value" id="infoUsername">—</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">🔐 Auth Mode</span>
                        <span class="info-value">3-Factor (User + Pass + Wi-Fi)</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">📡 System</span>
                        <span class="info-value">Smart GuardX Rover v1.0</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">🌐 Status</span>
                        <span class="info-value status-online" id="infoStatus">● Online</span>
                    </div>
                </div>

                <div class="profile-actions">
                    <a href="index.html" class="btn btn-primary">⚙️ Go to Dashboard</a>
                    <button class="btn btn-outline" onclick="logout()">Disconnect</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Mobile menu toggle
        function toggleMobileNav() {
            const links = document.getElementById('topnavLinks');
            const toggle = document.getElementById('navToggle');
            if (links) {
                links.classList.toggle('open');
                const isOpen = links.classList.contains('open');
                if (toggle) toggle.textContent = isOpen ? '✕' : '☰';
            }
        }

        // Close mobile nav when clicking outside
        document.addEventListener('click', (e) => {
            const topnav = document.querySelector('.topnav');
            const links = document.getElementById('topnavLinks');
            const toggle = document.getElementById('navToggle');
            if (links && links.classList.contains('open') && topnav && !topnav.contains(e.target)) {
                links.classList.remove('open');
                if (toggle) toggle.textContent = '☰';
            }
        });

        // Theme functions
        function initTheme() {
            const saved = localStorage.getItem('sgx_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
            updateThemeToggleBtn(saved);
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'dark';
            let next = 'light';
            if (current === 'dark') next = 'light';
            else if (current === 'light') next = 'bw';
            else next = 'dark';

            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('sgx_theme', next);
            updateThemeToggleBtn(next);
        }

        function updateThemeToggleBtn(theme) {
            const btnText = document.getElementById('themeToggleText');
            const btnIcon = document.getElementById('themeToggleIcon');
            if (!btnText) return;
            if (theme === 'light') {
                btnText.textContent = 'Light';
                if (btnIcon) btnIcon.textContent = '☀️';
            } else if (theme === 'bw') {
                btnText.textContent = 'B & W';
                if (btnIcon) btnIcon.textContent = '🔲';
            } else {
                btnText.textContent = 'Dark';
                if (btnIcon) btnIcon.textContent = '🌙';
            }
        }

        initTheme();

        // Read stored username (set during login)
        const storedUser = localStorage.getItem('sgx_username') || sessionStorage.getItem('sgx_username') || 'Operator';

        document.getElementById('profileUsername').textContent = storedUser.toUpperCase();
        document.getElementById('infoUsername').textContent    = storedUser;

        // Load video count from backend
        fetch('http://localhost:8000/api/videos')
            .then(r => r.json())
            .then(d => {
                const count = (d.videos || []).length;
                document.getElementById('statVideos').textContent  = count;
                document.getElementById('statSessions').textContent = '1';
            })
            .catch(() => {
                document.getElementById('statVideos').textContent  = '—';
                document.getElementById('infoStatus').textContent   = '⚠ Backend Offline';
                document.getElementById('infoStatus').classList.remove('status-online');
            });

        function logout() {
            localStorage.removeItem('sgx_username');
            sessionStorage.removeItem('sgx_username');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
